<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Caro: pedidos de comida, mesas, caja y reparto para tu negocio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Caro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Caro | Pedidos de comida</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // La app ya no usa "service worker": así cada persona ve siempre la
    // última versión publicada. Si el navegador guardó uno de una versión
    // anterior, se borra junto con su copia y se recarga una sola vez.
    (function () {
      try {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          var borrar = regs.map(function (r) { return r.unregister(); });
          if (window.caches) {
            borrar.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(borrar).then(function () {
            var yaRecargo = false;
            try { yaRecargo = sessionStorage.getItem('caroSinSW') === '1'; } catch (e) {}
            if (yaRecargo) return;
            try { sessionStorage.setItem('caroSinSW', '1'); } catch (e) {}
            location.reload();
          });
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
