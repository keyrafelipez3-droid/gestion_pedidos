<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nami: pedidos de comida, mesas, caja y reparto para tu negocio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nami">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nami | Pedidos de comida</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2A1730">
  <style>
    /* Pantalla de carga mientras se descarga la app (la quita Flutter al
       dibujar su primer cuadro). */
    html, body { margin: 0; background: #2A1730; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #2A1730; transition: opacity .35s ease; z-index: 10;
    }
    #carga img { width: 96px; height: 96px; border-radius: 22px; animation: latido 1.6s ease-in-out infinite; }
    #carga .barra { width: 120px; height: 3px; border-radius: 3px; background: #4A3550; overflow: hidden; }
    #carga .barra::after {
      content: ""; display: block; width: 40%; height: 100%; background: #FFB020;
      animation: avance 1.1s ease-in-out infinite;
    }
    #carga.oculta { opacity: 0; pointer-events: none; }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes avance { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #carga img, #carga .barra::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-label="Cargando Nami">
    <img src="icons/Icon-192.png" alt="">
    <div class="barra"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (!c) return;
      c.classList.add('oculta');
      setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 400);
    });
  </script>
  <script>
    // La app ya no usa "service worker": así cada persona ve siempre la
    // última versión publicada. Si el navegador guardó uno de una versión
    // anterior, se borra junto con su copia y se recarga una sola vez.
    (function () {
      try {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          var borrar = regs.map(function (r) { return r.unregister(); });
          if (window.caches) {
            borrar.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(borrar).then(function () {
            var yaRecargo = false;
            try { yaRecargo = sessionStorage.getItem('caroSinSW') === '1'; } catch (e) {}
            if (yaRecargo) return;
            try { sessionStorage.setItem('caroSinSW', '1'); } catch (e) {}
            location.reload();
          });
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
